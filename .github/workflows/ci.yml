name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tms_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tms_test
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/tms_test

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Typecheck API
        run: pnpm --filter api exec tsc -p tsconfig.build.json --noEmit

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit

      - name: Apply migrations to test database
        run: pnpm --filter api exec prisma migrate deploy

      - name: API tests
        run: pnpm --filter api test

      - name: Build web
        run: pnpm --filter web build
